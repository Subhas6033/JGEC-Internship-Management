name: Deploy JGEC Internship Management

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: jgec-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}

          script: |
            set -e

            echo "======================================"
            echo "Starting JGEC deployment"
            echo "======================================"

            /root/deploy-jgec.sh

            echo "======================================"
            echo "JGEC deployment completed successfully"
            echo "======================================"
